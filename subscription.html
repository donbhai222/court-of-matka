<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Royal Magic Panel Chart</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{
    --bg-page:#fff3c4;
    --text-dark:#111827;
    --text-blue:#1e40af;
    --sky-blue:#0ea5e9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    background:var(--bg-page);
    font-family:'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;
    padding:20px 14px;
    font-weight:700;
}
.header{
    background:linear-gradient(135deg,#fde68a 0%,#fcd34d 50%,#fbbf24 100%);
    padding:16px;
    text-align:center;
    border-radius:12px;
    margin-bottom:20px;
    border-bottom:2px solid #f59e0b;
    box-shadow:0 4px 15px rgba(245,158,11,0.3);
}
.header h1{
    font-size:18px;
    font-weight:900;
    color:#dc2626;
    text-transform:uppercase;
    font-family:'Arial Black',sans-serif;
    letter-spacing:1px;
}
.form-box{
    background:#fff;
    border:3px solid var(--sky-blue);
    border-radius:14px;
    padding:22px 18px;
    box-shadow:0 4px 20px rgba(14,165,233,0.3);
    max-width:480px;
    margin:0 auto;
}
.form-title{
    text-align:center;
    font-size:17px;
    color:#dc2626;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:6px;
    font-family:'Arial Black',sans-serif;
}
.form-sub{
    text-align:center;
    font-size:11px;
    color:var(--text-blue);
    margin-bottom:20px;
    line-height:1.5;
}
label{
    display:block;
    font-size:12px;
    color:var(--text-blue);
    margin-bottom:5px;
    margin-top:14px;
}
input, select{
    width:100%;
    padding:12px;
    border:2px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    background:#f8fafc;
    outline:none;
    font-family:'Segoe UI',sans-serif;
}
input:focus, select:focus{
    border-color:var(--sky-blue);
    background:#fff;
    box-shadow:0 0 0 3px rgba(14,165,233,0.2);
}
.btn-submit{
    display:block;
    width:100%;
    margin-top:22px;
    padding:15px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(22,163,74,0.4);
    font-family:'Segoe UI',sans-serif;
}
.btn-submit:active{transform:scale(0.98);}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed;box-shadow:none;}
.back-btn{
    display:block;
    width:100%;
    margin-top:12px;
    padding:13px;
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    color:#fff;
    border:2px solid #0284c7;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    box-shadow:0 3px 10px rgba(14,165,233,0.4);
    font-family:'Segoe UI',sans-serif;
}
.pay-info{
    background:#fef9c3;
    border:1px solid #fde68a;
    border-radius:8px;
    padding:12px;
    margin-top:16px;
    font-size:11px;
    color:#1e40af;
    line-height:1.6;
    text-align:center;
}
.all-rights{
    background:#334155;
    color:#fff;
    text-align:center;
    padding:14px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    border-radius:14px;
    margin:20px auto 0;
    max-width:480px;
    font-family:'Segoe UI',sans-serif;
}
.status-msg{
    display:none;
    margin-top:14px;
    padding:12px;
    border-radius:8px;
    font-size:12px;
    text-align:center;
    line-height:1.5;
}
.status-success{background:#dcfce7;color:#166534;border:1px solid #86efac;display:block;}
.status-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;display:block;}
.status-loading{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;display:block;}
</style>
</head>
<body>

<div class="header">
    <h1>ROYAL MAGIC PANEL CHART</h1>
</div>

<div class="form-box">
    <div class="form-title">Create Account / खाता बनाएं 🔑</div>
    <div class="form-sub">खाता बनाने के लिए जानकारी भरें और पेमेंट पूरा करें।</div>

    <form id="signupForm" onsubmit="handlePayment(event)">
        <label>पूरा नाम / Full Name</label>
        <input type="text" id="name" placeholder="अपना नाम लिखें" required>

        <label>मोबाइल नंबर / Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10 अंकों का नंबर"
               pattern="[6-9][0-9]{9}" required>

        <label>ईमेल / Email</label>
        <input type="email" id="email" placeholder="example@mail.com" required>

        <label>पासवर्ड / Password</label>
        <input type="password" id="password" placeholder="मजबूत पासवर्ड"
               minlength="6" required>

        <label>प्लान चुनें / Select Plan</label>
        <select id="plan" required onchange="updateAmount()">
            <option value="">-- प्लान चुनें --</option>
            <option value="500">Basic - ₹500 / महीना</option>
            <option value="1000">Standard - ₹1000 / 3 महीने</option>
            <option value="2500">Premium - ₹2500 / 6 महीने</option>
        </select>

        <button type="submit" id="payBtn" class="btn-submit">
            PAY NOW / अभी भुगतान करें 💳
        </button>

        <div id="statusMsg" class="status-msg"></div>
    </form>

    <div class="pay-info">
        🔒 सुरक्षित पेमेंट — UPI, कार्ड, नेटबैंकिंग, वॉलेट सभी स्वीकार्य।<br>
        Razorpay द्वारा संचालित।
    </div>

    <a href="index.html" class="back-btn">← वापस जाएं / GO BACK</a>
</div>

<div class="all-rights">All Rights Reserved © 2026 Royal Magic Panel Chart</div>

<script>
// ⚠️ यहाँ अपनी Razorpay Key ID डालें
const RAZORPAY_KEY_ID = "rzp_test_XXXXXXXXXXXX";

function handlePayment(e) {
    e.preventDefault();

    const name     = document.getElementById("name").value.trim();
    const mobile   = document.getElementById("mobile").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const amount   = parseInt(document.getElementById("plan").value);

    if (!name || !mobile || !email || !password || !amount) {
        showStatus("कृपया सभी जानकारी सही भरें!", "error");
        return;
    }
    if (!/^[6-9][0-9]{9}$/.test(mobile)) {
        showStatus("मोबाइल नंबर सही नहीं है (10 अंक, 6-9 से शुरू)!", "error");
        return;
    }

    const options = {
        key: RAZORPAY_KEY_ID,
        amount: amount * 100,
        currency: "INR",
        name: "Royal Magic Panel Chart",
        description: "Account Setup Payment",
        prefill: { name: name, email: email, contact: mobile },
        notes: { plan: amount, user_name: name },
        theme: { color: "#0ea5e9" },
        handler: function (response) {
            onPaymentSuccess(response, { name: name, mobile: mobile, email: email, amount: amount });
        },
        modal: {
            ondismiss: function () {
                showStatus("पेमेंट रद्द कर दिया गया।", "error");
                resetButton();
            }
        }
    };

    try {
        showStatus("पेमेंट विंडो खुल रही है...", "loading");
        const rzp = new Razorpay(options);
        rzp.on("payment.failed", function (resp) {
            showStatus("❌ पेमेंट विफल: " + resp.error.description, "error");
            resetButton();
        });
        rzp.open();
        document.getElementById("payBtn").disabled = true;
        document.getElementById("payBtn").textContent = "प्रोसेस हो रहा है...";
    } catch (err) {
        showStatus("पेमेंट शुरू नहीं हो सका: " + err.message, "error");
        resetButton();
    }
}

function onPaymentSuccess(response, user) {
    showStatus("✅ पेमेंट सफल! Payment ID: " + response.razorpay_payment_id, "success");
    setTimeout(function () {
        alert(
            "🎉 धन्यवाद " + user.name + "!\n\n" +
            "पेमेंट सफल हो गया।\n" +
            "Payment ID: " + response.razorpay_payment_id + "\n" +
            "राशि: ₹" + user.amount + "\n\n" +
            "आपका खाता सक्रिय कर दिया गया है।"
        );
        window.location.href = "index.html?payment=success";
    }, 1500);
}

function showStatus(msg, type) {
    const el = document.getElementById("statusMsg");
    el.className = "status-msg status-" + type;
    el.textContent = msg;
}

function resetButton() {
    const btn = document.getElementById("payBtn");
    btn.disabled = false;
    btn.textContent = "PAY NOW / अभी भुगतान करें 💳";
}

function updateAmount() {
    const amount = document.getElementById("plan").value;
    if (amount) {
        document.getElementById("payBtn").textContent =
            "PAY ₹" + amount + " / भुगतान करें 💳";
    }
}
</script>

</body>
</html>
